<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Dashboard — KŌHĪ Atelier</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Minimalist Navigation -->
    <header class="cafe-nav">
      <div class="nav-inner">
        <a href="dashboard.html" class="nav-brand">
          <span class="brand-icon">☕</span>
          <span class="brand-name">KŌHĪ</span>
          <span class="brand-tag">Member Club</span>
        </a>
        <div class="nav-actions">
          <a href="index.html" class="btn-secondary">Public View</a>
          <button class="btn-signout" onclick="logout()">Sign Out</button>
        </div>
      </div>
    </header>

    <main>
      <!-- Hero / Member Welcome Section -->
      <section class="hero-wrapper">
        <div class="hero-pill member-pill">
          <span class="hero-pill-dot"></span>
          <span>Active Membership • 15% Savings</span>
        </div>

        <h1 class="hero-title" id="welcomeHeading">Welcome back.</h1>
        <p class="hero-subtitle">
          Your exclusive club benefits are unlocked. Enjoy 15% off all single-origins, seasonal roasts, and signature lattes.
        </p>

        <!-- Member Profile Ribbon -->
        <div class="member-banner">
          <div class="member-info-left">
            <div class="member-avatar" id="memberAvatar">M</div>
            <div>
              <div class="member-details-name" id="userName">Loading Member...</div>
              <div class="member-details-email" id="userEmail">Connecting to session...</div>
            </div>
          </div>
          <div class="member-info-right">
            <span class="member-status-pill">
              <span>●</span> 15% Member Discount Applied
            </span>
          </div>
        </div>
      </section>

      <!-- Coffee Menu Grid with Member Pricing -->
      <section class="menu-container">
        <div id="coffeeGridMember" class="coffee-grid"></div>
      </section>
    </main>

    <!-- Scripts -->
    <script src="coffee-data.js"></script>
    <script>
      const API_URL = "https://login-system-2qxu.onrender.com";
      const token = localStorage.getItem("token");

      if (!token) {
        window.location.href = "index.html";
      } else {
        loadProfile();
        // Render coffee grid with member pricing active (true)
        renderCoffeeGrid("coffeeGridMember", true);
      }

      function loadProfile() {
        fetch(`${API_URL}/api/profile`, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        })
        .then(response => {
          if (!response.ok) throw new Error("Unauthorized");
          return response.json();
        })
        .then(data => {
          if (data.user) {
            const name = data.user.name || "Coffee Lover";
            document.getElementById("welcomeHeading").textContent = `Welcome back, ${name}.`;
            document.getElementById("userName").textContent = name;
            document.getElementById("userEmail").textContent = data.user.email;
            
            const firstLetter = name.trim().charAt(0).toUpperCase() || "K";
            document.getElementById("memberAvatar").textContent = firstLetter;
          }
        })
        .catch(() => {
          localStorage.removeItem("token");
          window.location.href = "index.html";
        });
      }

      function logout() {
        localStorage.removeItem("token");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
