<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D211A"/>
      <stop offset="100%" stop-color="#1A120E"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8854E"/>
      <stop offset="100%" stop-color="#A56230"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)"/>

  <!-- Minimalist Coffee Cup -->
  <g fill="none" stroke="#FAF7F2" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cup Body -->
    <path d="M120 180 H340 C340 180 340 330 230 330 C120 330 120 180 120 180 Z" fill="#FAF7F2"/>
    <!-- Cup Handle -->
    <path d="M340 210 C380 210 400 240 400 260 C400 285 375 305 330 305" />
    <!-- Steam Curves -->
    <path d="M185 130 Q195 105 185 85" stroke="url(#coffeeGrad)" stroke-width="20"/>
    <path d="M230 135 Q240 110 230 90" stroke="url(#coffeeGrad)" stroke-width="20"/>
    <path d="M275 130 Q285 105 275 85" stroke="url(#coffeeGrad)" stroke-width="20"/>
    <!-- Saucer -->
    <line x1="100" y1="365" x2="360" y2="365" stroke="#FAF7F2" stroke-width="26"/>
  </g>
</svg>
