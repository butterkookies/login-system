<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login System — Sign In</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="brand-mark"></div>

      <div class="auth-header">
        <h2 id="formTitle">Welcome Back</h2>
        <p id="formSubtitle">Enter your credentials to access your account</p>
      </div>

      <div class="segmented-control">
        <button type="button" class="segmented-btn active" id="tabLogin" onclick="switchTab('login')">Log In</button>
        <button type="button" class="segmented-btn" id="tabRegister" onclick="switchTab('register')">Sign Up</button>
      </div>

      <div class="form-group" id="nameGroup" style="display: none;">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Appleseed" autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button type="button" class="btn-apple-primary" id="loginBtn" onclick="login()">Log In</button>
      <button type="button" class="btn-apple-primary" id="registerBtn" onclick="register()" style="display: none;">Create Account</button>

      <p id="message"></p>
    </div>

    <script>
      function switchTab(mode) {
        const isLogin = mode === 'login';
        document.getElementById('tabLogin').classList.toggle('active', isLogin);
        document.getElementById('tabRegister').classList.toggle('active', !isLogin);
        document.getElementById('nameGroup').style.display = isLogin ? 'none' : 'block';
        document.getElementById('loginBtn').style.display = isLogin ? 'block' : 'none';
        document.getElementById('registerBtn').style.display = isLogin ? 'none' : 'block';
        document.getElementById('formTitle').innerText = isLogin ? 'Welcome Back' : 'Create Account';
        document.getElementById('formSubtitle').innerText = isLogin ? 'Enter your credentials to access your account' : 'Fill in the details to register a new account';
        
        const msg = document.getElementById('message');
        msg.innerText = '';
        msg.className = '';
      }
    </script>
    <script src="app.js"></script>
  </body>
</html>
